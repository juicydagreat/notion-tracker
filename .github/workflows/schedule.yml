name: Solana Notion Tracker

on:
  schedule:
    - cron: "0 17 * * *"   # 5 PM UTC daily
  workflow_dispatch:
    inputs:
      mode:
        description: "Which script to run"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - diagnostic
          - activity
          - trace
      target_sol:
        description: "trace mode: SOL amount to search for"
        required: false
        default: "5"
        type: string
      before_aest:
        description: "trace mode: ignore txns at/after this AEST time (YYYY-MM-DD HH:MM)"
        required: false
        default: ""
        type: string
      after_aest:
        description: "trace mode: ignore txns before this AEST time (window start)"
        required: false
        default: ""
        type: string
      list_all:
        description: "trace mode: list EVERY txn in the window (any amount, in or out)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      min_sol:
        description: "trace mode: range search — min SOL (overrides target_sol)"
        required: false
        default: ""
        type: string
      max_sol:
        description: "trace mode: range search — max SOL"
        required: false
        default: ""
        type: string
      scan_depth:
        description: "trace mode: transactions to scan per wallet (default 8)"
        required: false
        default: "8"
        type: string

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
        # No pip install needed — pure stdlib

      - name: Select script
        id: choose
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.mode }}" = "production" ]; then
            echo "script=sol_multi_to_notion.py" >> $GITHUB_OUTPUT
          elif [ "${{ inputs.mode }}" = "activity" ]; then
            echo "script=sol_activity.py" >> $GITHUB_OUTPUT
          elif [ "${{ inputs.mode }}" = "trace" ]; then
            echo "script=sol_trace.py" >> $GITHUB_OUTPUT
          else
            echo "script=sol_diagnostic.py" >> $GITHUB_OUTPUT
          fi

      - name: Run script
        env:
          NOTION_TOKEN:          ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_PERWALLET:   ${{ secrets.NOTION_DB_PERWALLET }}
          NOTION_DB_DAILYTOTAL:  ${{ secrets.NOTION_DB_DAILYTOTAL }}
          WALLETS_CSV:           ${{ secrets.WALLETS_CSV }}
          USDC_MINT:             ${{ secrets.USDC_MINT }}
          USDC_WALLET:           ${{ secrets.USDC_WALLET }}
          TITLE_PROP_PERWALLET:  ${{ secrets.TITLE_PROP_PERWALLET }}
          # AUD price (CoinGecko). Key is optional — free tier works without it.
          PRICE_COIN_ID:         "solana"
          COINGECKO_API_KEY:     ${{ secrets.COINGECKO_API_KEY }}
          # Isolates this tracker's rows in the shared daily-total DB so deltas
          # compare SOL-to-SOL only (not ETH rows or manual notes).
          ASSET_LABEL:           "SOL"
          # trace mode: amount to search for + optional AEST cutoff + range
          TARGET_SOL:            ${{ inputs.target_sol }}
          BEFORE_AEST:           ${{ inputs.before_aest }}
          MIN_SOL:               ${{ inputs.min_sol }}
          MAX_SOL:               ${{ inputs.max_sol }}
          SCAN_DEPTH:            ${{ inputs.scan_depth }}
          AFTER_AEST:            ${{ inputs.after_aest }}
          LIST_ALL:              ${{ inputs.list_all }}
          # Batch RPC endpoints (optional — if blocked, script auto-falls back to individual calls)
          SOLANA_PRIMARY_RPC:    "https://solana-rpc.publicnode.com"
          SOLANA_FALLBACK_RPC:   "https://rpc.ankr.com/solana"
          # Individual call fallback — mainnet-beta handles sequential calls fine
          INDIVIDUAL_RPC:        "https://api.mainnet-beta.solana.com"
          INDIVIDUAL_DELAY:      "2.0"
          # Batch tuning (only used if batch succeeds)
          BATCH_SIZE:            "10"
          BATCH_PAUSE:           "2.0"
          RPC_TIMEOUT:           "30"
          RPC_RETRIES:           "5"
          RPC_BACKOFF_CAP:       "30"
        run: python "${{ steps.choose.outputs.script }}"
